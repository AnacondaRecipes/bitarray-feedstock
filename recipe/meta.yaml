{% set name = "bitarray" %}
{% set version = "3.10.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: c33e48906407ab3d0edb96cc5ab2a599bda5dd04704ebcd9b3e0eedce7310e0a
  patches:
    # test_free_threading.py asserted Py_GIL_DISABLED unconditionally, crashing
    # tests on non-free-threaded builds. Patched to pytest.skip() instead.
    - patches/0001-Skip-test-which-uses-Py_GIL_DISABLED.patch

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<37]

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
  host:
    - python
    - pip
    - setuptools >=42.0.0
  run:
    - python
  run_constrained:
    - python >=3.6.1

test:
  imports:
    - bitarray
    - bitarray._bitarray
    - bitarray._util
    - bitarray.test_bitarray
    - bitarray.util
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest --pyargs bitarray
  requires:
    - pip
    - pytest

about:
  home: https://github.com/ilanschnell/bitarray
  license: PSF-2.0
  license_family: PSF
  license_file: LICENSE
  summary: efficient arrays of booleans -- C extension
  description: |
    Bitarray provides an object type which efficiently represents an array of
    booleans. Bitarrays are sequence types that behave very similarly
    to usual lists. All functionality is implemented in C.
  doc_url: https://pypi.org/pypi/bitarray
  dev_url: https://github.com/ilanschnell/bitarray

extra:
  recipe-maintainers:
    - nehaljwani
